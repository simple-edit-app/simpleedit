[package]
name = "simpleedit"
version = "1.26.0"
edition = "2021"
rust-version = "1.90"
description = "A fast, stable, cross-platform text editor"
license = "MIT"
repository = "https://github.com/simple-edit-app/simpleedit"
readme = "README.md"
keywords = ["text-editor", "editor", "syntax-highlighting"]
categories = ["text-editors"]

[[bin]]
name = "simpleedit"
path = "src/main.rs"

# The PostgreSQL driver of the Database panel: a separate program, downloaded
# by the app on demand and published with each release.
[[bin]]
name = "simpleedit-db-postgres"
path = "drivers/postgres/main.rs"
required-features = ["drivers"]

# The SQLite and MySQL / MariaDB drivers: the same, for those databases.
[[bin]]
name = "simpleedit-db-sqlite"
path = "drivers/sqlite/main.rs"
required-features = ["drivers"]

[[bin]]
name = "simpleedit-db-mysql"
path = "drivers/mysql/main.rs"
required-features = ["drivers"]

[[test]]
name = "sql_drivers"
path = "tests/sql_drivers.rs"
required-features = ["drivers"]

[features]
# The database drivers (separate programs, built beside the editor) and what
# only they need: PostgreSQL, MySQL and SQLite, with their TLS. The editor
# itself compiles without them: `cargo build --bin simpleedit --no-default-features`.
default = ["drivers"]
drivers = ["dep:postgres", "dep:rustls", "dep:tokio-postgres-rustls", "dep:rustls-native-certs", "dep:rusqlite", "dep:mysql"]

[dependencies]
iced = { version = "0.14", features = ["advanced", "tokio", "lazy", "selector", "canvas"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "wrap"] }
iced_fonts = { version = "0.3", features = ["nerd", "lucide"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
regex = "1"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
rfd = "0.14"
dirs = "5"
rust-i18n = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "multipart", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "fs", "macros"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
tempfile = "3"
portable-pty = "0.9.0"
vt100 = "0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
similar = "3.2.1"
unicode-width = "0.2"
postgres = { version = "0.19", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-postgres-rustls = { version = "0.14.0", optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
sqlformat = "0.5.0"
spellbook = "0.4"
rust_xlsxwriter = "0.102.0"
serde_norway = "0.9"
rusqlite = { version = "0.41", features = ["bundled", "hooks"], optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"], optional = true }
trash = "5.3.0"
notify = "8"

# The system menu bar on macOS (File, Edit, View and Help up there).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
# Passwords of the data sources live in the system keychain.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
# The SSH tunnel of the drivers dies with its driver (`PR_SET_PDEATHSIG`,
# Linux), and a stopped task takes its whole process group with it.
libc = "0.2"

[dev-dependencies]
# Checks that every file icon is a glyph of the bundled Nerd Font.
ttf-parser = "0.25"
# Draws the window to a PNG without a screen (`look_tests`, run by hand).
iced_test = "0.14"

# Text shaping and syntax highlighting are very slow unoptimized: jumping
# to the middle of a 3 000-line file took 30 s in a debug build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer-scripts = "debian/"
maintainer = "sindus"
copyright = "2024, sindus"
license-file = ["LICENSE", "0"]
extended-description = "A fast, stable, cross-platform text editor with syntax highlighting for 30+ languages."
depends = "$auto"
recommends = "policykit-1 | pkexec"
section = "editors"
priority = "optional"
assets = [
    ["target/release/simpleedit", "usr/bin/", "755"],
    ["assets/simpleedit.desktop", "usr/share/applications/", "644"],
    ["assets/simpleedit.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/simpleedit.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]


# Patched copies of iced 0.14.1 crates; see vendor/PATCHES.md (a test fails
# when a patch is no longer applied).
# - iced_winit: without winit's default macOS menu, whose Cmd+Q quits without
#   saving the session.
# - iced_graphics: `set_hidden_lines` for code folding.
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
iced_graphics = { path = "vendor/iced_graphics" }
