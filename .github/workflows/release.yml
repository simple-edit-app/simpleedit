name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: simpleedit

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-aarch64-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package tarball
        run: |
          cd target/aarch64-apple-darwin/release
          tar czf simpleedit-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz ${{ env.BINARY_NAME }}
          mv simpleedit-*.tar.gz ${{ github.workspace }}/
      - name: Build .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="SimpleEdit.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }} "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/${{ env.BINARY_NAME }}"

          # .icns from the existing PNG, sized down from the largest square available
          mkdir -p simpleedit.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/simpleedit.png \
              --out "simpleedit.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) assets/simpleedit.png \
              --out "simpleedit.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns simpleedit.iconset -o "$APP/Contents/Resources/simpleedit.icns"
          rm -rf simpleedit.iconset

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SimpleEdit</string>
            <key>CFBundleDisplayName</key><string>SimpleEdit</string>
            <key>CFBundleIdentifier</key><string>app.simpleedit.SimpleEdit</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>${{ env.BINARY_NAME }}</string>
            <key>CFBundleIconFile</key><string>simpleedit</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Text Document</string>
                <key>CFBundleTypeRole</key><string>Editor</string>
                <key>LSItemContentTypes</key>
                <array><string>public.text</string><string>public.source-code</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature: unsigned bundles are rejected outright on Apple Silicon
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" \
            "simpleedit-${{ github.ref_name }}-macos-aarch64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: simpleedit-macos-aarch64
          path: |
            simpleedit-*.tar.gz
            simpleedit-*-macos-aarch64.zip

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-x86_64-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libvulkan-dev
      - name: Build binary
        run: cargo build --release
      - name: Package tarball
        run: |
          cd target/release
          tar czf simpleedit-${{ github.ref_name }}-x86_64-linux.tar.gz ${{ env.BINARY_NAME }}
          mv simpleedit-*.tar.gz ${{ github.workspace }}/
      - name: Build DEB
        run: |
          cargo install --force cargo-deb
          cargo deb
          cp target/debian/*.deb ${{ github.workspace }}/
      - uses: actions/upload-artifact@v4
        with:
          name: simpleedit-linux
          path: |
            simpleedit-*.tar.gz
            *.deb

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            simpleedit-*.tar.gz
            simpleedit-*-macos-aarch64.zip
            *.deb
          generate_release_notes: true
          draft: false

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The `secrets` context is not available in a job-level `if:`, so the
      # presence of the PAT is resolved here and gates the steps below.
      - name: Look for a tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_GITHUB_TOKEN is not set — skipping the Homebrew cask bump. Update Casks/simpleedit.rb by hand."
          fi
      - name: Check out the tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: simple-edit-app/homebrew-tap
          # PAT with `contents: write` on the tap repo.
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Bump cask to ${{ github.ref_name }}
        if: steps.tap.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="simpleedit-${GITHUB_REF_NAME}-macos-aarch64.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"

          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$ZIP" "$URL"
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          rm -f "$ZIP"

          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/simpleedit.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|"      Casks/simpleedit.rb

          grep -q "\"${VERSION}\"" Casks/simpleedit.rb || { echo "version bump failed"; exit 1; }
          grep -q "\"${SHA}\"" Casks/simpleedit.rb     || { echo "sha256 bump failed"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/simpleedit.rb
          git diff --staged --quiet || git commit -m "simpleedit ${VERSION}"
          git push
